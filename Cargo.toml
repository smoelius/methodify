[package]
name = "methodify"
version = "0.1.1"
authors = ["Samuel Moelius <sam@moeli.us>"]
description = "Proc macro attribute that turns a function into a trait method for its first argument"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/smoelius/methodify"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0", features = ["full"] }

[dev-dependencies]
assert_cmd = "2.2"
regex = "1.12"
snapbox = "1.2"
tempfile = "3.27"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ["cfg(dylint_lib, values(any()))"]
